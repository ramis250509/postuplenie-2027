<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
</head>
<body>
<title>Поступление 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: боковая навигация (десктоп) / нижняя панель (телефон) + одна колонка контента.
   Карточки — только для объектов (вуз, стипендия, слой стоимости); остальное — списки. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E9EEF1; --line:#D8E0E5;
  --ink:#0F1F2B; --ink-2:#46596A; --ink-3:#768795;
  --accent:#0A6F8C; --accent-ink:#FFFFFF; --accent-soft:#DAEEF3;
  --ok:#1B8655; --ok-soft:#DCF1E6; --warn:#9E6410; --warn-soft:#FAEDD2;
  --crit:#C2283F; --crit-soft:#FADFE3; --gold:#9A6A00; --gold-soft:#FFF0C2;
  --info:#3B57BD; --info-soft:#E2E7F9;
  --shadow:0 1px 2px rgba(15,31,43,.05),0 10px 24px -14px rgba(15,31,43,.22);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px; --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1419; --surface:#141E25; --surface-2:#1B2731; --line:#26343F;
  --ink:#E4ECF1; --ink-2:#A3B3BF; --ink-3:#71818D;
  --accent:#4DB6D2; --accent-ink:#06222B; --accent-soft:#113340;
  --ok:#4CC089; --ok-soft:#12321F; --warn:#E2A84B; --warn-soft:#382A10;
  --crit:#FF6E80; --crit-soft:#3B1720; --gold:#F0BF4C; --gold-soft:#3A2D0B;
  --info:#8EA4FF; --info-soft:#1C2547;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1419; --surface:#141E25; --surface-2:#1B2731; --line:#26343F;
  --ink:#E4ECF1; --ink-2:#A3B3BF; --ink-3:#71818D;
  --accent:#4DB6D2; --accent-ink:#06222B; --accent-soft:#113340;
  --ok:#4CC089; --ok-soft:#12321F; --warn:#E2A84B; --warn-soft:#382A10;
  --crit:#FF6E80; --crit-soft:#3B1720; --gold:#F0BF4C; --gold-soft:#3A2D0B;
  --info:#8EA4FF; --info-soft:#1C2547;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 clamp(22px,3vw,28px)/1.2 var(--f-display);letter-spacing:-.01em}
h2{font:600 17px/1.3 var(--f-body)}
h3{font:600 16px/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-display)}
.brand b{display:block;font:600 14px/1.2 var(--f-display)}
.brand span{font-size:12.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;background:var(--surface-2);color:var(--ink-2);border-radius:20px;padding:1px 8px}
.nav a.on .count{background:var(--surface);color:var(--accent)}
.nav .count.hot{background:var(--crit-soft);color:var(--crit)}
.side-actions{display:grid;gap:8px;padding:0 4px}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;margin-top:5px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.main{margin-left:var(--side);padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.bottom{display:none}
.fab{display:none}

@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--ink-3);text-decoration:none;background:none;border:0;position:relative}
  .bottom a.on{color:var(--accent)}
  .bottom .plus{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-2px auto 0;box-shadow:var(--shadow)}
  .bottom .badge-n{position:absolute;top:2px;left:calc(50% + 6px);background:var(--crit);color:#fff;font-size:10px;line-height:16px;min-width:16px;border-radius:8px;padding:0 4px}
}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.section{display:grid;gap:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{display:flex;align-items:center;gap:8px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .eyebrow{margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-neutral{background:var(--surface-2);color:var(--ink-2)}
.t-accent{background:var(--accent-soft);color:var(--accent)}
.t-info{background:var(--info-soft);color:var(--info)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-crit{background:var(--crit-soft);color:var(--crit)}
.t-gold{background:var(--gold-soft);color:var(--gold)}
.t-muted{background:var(--surface-2);color:var(--ink-3)}
.t-unv{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.src.ok{color:var(--ok)}
.src.stale{color:var(--warn)}
.src.unv{color:var(--ink-3);border:1px dashed var(--line);padding:1px 7px;border-radius:6px}
.empty{padding:22px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice .btn{margin-left:auto}
.notice>svg{flex:none;margin-top:2px}
.notice-body{display:grid;gap:4px;min-width:0}
.notice b{font-weight:600}

/* ---------- animation ---------- */
.view{animation:viewIn .22s ease-out both}
@keyframes viewIn{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.grow{transform-origin:left;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:hidden}
.hero-main{padding:22px 24px;display:grid;gap:8px;align-content:start}
.dday{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.dday .n{font:600 56px/1 var(--f-display);letter-spacing:-.03em}
.dday .u{font-size:16px;font-weight:600;color:var(--ink-2)}
.dday.crit .n{color:var(--crit)} .dday.warn .n{color:var(--warn)} .dday.accent .n{color:var(--accent)}
.hero-title{font-size:18px;font-weight:600}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--line);background:var(--surface-2)}
.stat{padding:18px 20px;display:grid;gap:2px;align-content:start;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-last-child(-n+2){border-bottom:0}
a.stat:hover{background:color-mix(in srgb,var(--surface) 50%,transparent);text-decoration:none}
.stat b{font:600 26px/1.15 var(--f-display)}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.hot b{color:var(--crit)}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.hero-stats{border-left:0;border-top:1px solid var(--line)}.dday .n{font-size:46px}.hero-main{padding:18px}}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pipe a{display:grid;gap:4px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.pipe a:hover{border-color:var(--accent);transform:translateY(-1px)}
.pipe b{font:600 24px/1.1 var(--f-display)}
.pipe .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.pipe .names{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.pipe .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:720px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:grid}
.list>*+*{border-top:1px solid var(--line)}
.panel{padding:6px 0}
.panel-head{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-foot{padding:10px 18px 12px}
.dl-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 18px;text-decoration:none;color:inherit;transition:background .15s}
a.dl-row:hover{background:var(--surface-2);text-decoration:none}
.dl-date{display:grid;justify-items:center;line-height:1.05;border-radius:10px;padding:6px 0;background:var(--surface-2)}
.dl-date b{font:600 18px var(--f-display)}
.dl-date span{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.dl-body{min-width:0;display:grid;gap:1px}
.dl-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-sub{font-size:13px;color:var(--ink-2)}
.dl-meta{font-size:12px;color:var(--ink-3)}
.dl-right{display:grid;justify-items:end;gap:4px}
.done-row{opacity:.55}
.done-row .dl-title,.done-row .t-title{text-decoration:line-through}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 18px}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);animation:pop .2s ease-out}
@keyframes pop{from{transform:rotate(-45deg) scale(.3)}to{transform:rotate(-45deg) scale(1) translate(1px,-1px)}}
.t-title{font-weight:500;cursor:pointer}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.t-meta a{color:var(--ink-2)}
.prio{color:var(--crit);font-weight:600}
.fin-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) minmax(120px,auto);gap:14px;align-items:center;padding:13px 18px;text-decoration:none;color:inherit}
a.fin-row:hover{background:var(--surface-2);text-decoration:none}
.fin-name{min-width:0}
.fin-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:visible}
.fin-track .cov{position:absolute;inset:0 auto 0 0;border-radius:6px;background:repeating-linear-gradient(-45deg,var(--ok-soft) 0 6px,color-mix(in srgb,var(--ok) 25%,var(--ok-soft)) 6px 9px)}
.fin-track .pay{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.fin-track .pay.offer{background:var(--ok)}
.fin-track .budget{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.fin-amt{text-align:right;display:grid;gap:1px}
.fin-amt b{font:600 16px var(--f-display)}
.fin-amt span{font-size:12px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:6px 18px 14px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
@media (max-width:640px){.fin-row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.fin-track{grid-column:1/-1;grid-row:2}}

/* ---------- unis ---------- */
.toolbar{display:grid;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:38px}
.filters{display:grid;gap:10px}
.frow{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.frow .fl{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;min-width:92px;flex:none}
.chip{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{opacity:.6;margin-left:4px}
.ftoggle{display:none}
@media (max-width:860px){.head-actions{display:none}}
@media (max-width:720px){.frow .fl{display:none}.ftoggle{display:inline-flex}.filters.closed{display:none}}
.uni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:400px){.uni-grid{grid-template-columns:minmax(0,1fr)}}
.uni-card{position:relative;padding:16px 18px;display:grid;gap:12px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .2s,transform .2s;align-content:start}
.uni-card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow);transform:translateY(-2px);text-decoration:none}
.uc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.uc-name{display:grid;gap:2px}
.uc-name h3{font-size:17px}
.uc-prog{font-size:13.5px;color:var(--ink-2)}
.covers{display:flex;gap:6px;flex-wrap:wrap}
.cv{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 8px;border-radius:7px}
.cv-yes{background:var(--ok-soft);color:var(--ok)}
.cv-partial{background:var(--warn-soft);color:var(--warn)}
.cv-no{background:var(--crit-soft);color:var(--crit)}
.cv-unknown{color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.uc-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.kv{display:grid;gap:1px;min-width:0}
.kv label{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{font-size:12px;color:var(--ink-3)}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.progress .bar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.ex-tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:500}
.d-head{display:grid;gap:12px}
.d-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.d-title h1{font-size:clamp(22px,3.4vw,30px)}
.d-sub{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--ink-2);font-size:14.5px;margin-top:6px}
.status-select{appearance:none;-webkit-appearance:none;border:0;border-radius:20px;padding:7px 32px 7px 14px;font-weight:600;font-size:14px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0}
.jump::-webkit-scrollbar{display:none}

/* ----- время дедлайнов: перевод в бишкекское ----- */
function tzOffset(tz,ms){
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});

  }catch(e){return 6*36e5;}
}
function deadlineInstant(d){
  if(!d||!d.date)return null;
  const [y,m,day]=d.date.split('-').map(Number);
  const [hh,mm]=(d.time||'23:59').split(':').map(Number);
  const tz=d.time?(d.tz||BISHKEK):BISHKEK;
  const guess=Date.UTC(y,m-1,day,hh||0,mm||0);
  const off=tzOffset(tz,guess);let inst=guess-off;
  const off2=tzOffset(tz,inst);if(off2!==off)inst=guess-off2;
  return inst;
}
function fmtBishkek(ms){try{return new Intl.DateTimeFormat('ru-RU',{timeZone:BISHKEK,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ms));}catch(e){return '';}}

  if(h<48){const n=Math.max(1,Math.floor(h));return {txt:n+' ч',tone:'crit',n,unit:plural(n,'час','часа','часов')};}
  const d=Math.ceil(ms/864e5);
  return {txt:d+' дн.',tone:d<=7?'crit':d<=21?'warn':'accent',n:d,unit:plural(d,'день','дня','дней')};
}

/* ----- финансы ----- */
function layerSum(layer){
  if(!layer)return null;const it=layer.items||{};let s=0,k=0;
  for(const [key] of COST_ITEMS){if(num(it[key])){s+=it[key];k++;}}
  if(num(layer.total))return {total:layer.total,known:k,official:true};
  return k?{total:s,known:k,official:false}:null;
}
function activeSch(u){return (u.scholarships||[]).filter(s=>s.status!=='rejected'&&s.status!=='na');}
function finance(u){
  const c=u.costs||{};const cur=c.currency||'USD';
  const pub=layerSum(c.published),est=layerSum(c.estimate);
  const baseLayer=est?c.estimate:c.published;const base=est||pub;
  let cov=0;const covParts=[],uncounted=[];
  if(base){
    const items=(baseLayer&&baseLayer.items)||{};
    for(const s of activeSch(u)){
      if(s.include===false)continue;
      let v=0;
      if(num(s.amount))v=s.amount;
      else{const cv=s.covers||{};
        if(cv.tuition==='yes')v+=(items.tuition||0)+(items.fees||0);
        for(const k of ['housing','food','insurance','travel'])if(cv[k]==='yes')v+=items[k]||0;}
      if(v>0){cov+=v;covParts.push({name:s.name,v});}else uncounted.push(s.name);
    }
    cov=Math.min(cov,base.total);
  }
  const prelim=base?Math.max(0,base.total-cov):null;
  const o=c.offer||{};
  const offerNet=num(o.net)?o.net:(num(o.coa)&&num(o.grants)?Math.max(0,o.coa-o.grants):null);
  const mine=offerNet!=null?offerNet:prelim;
  const basis=offerNet!=null?'offer':prelim!=null?'prelim':'none';
  return {cur,pub,est,base,baseKind:est?'estimate':'published',cov,covParts,uncounted,prelim,offerNet,mine,basis};
}
const BASIS = {offer:{label:'по предложению вуза',tone:'ok'},prelim:{label:'предварительный расчёт',tone:'accent'},none:{label:'нельзя рассчитать',tone:'unv'}};
function toUSD(n,cur,settings){if(!num(n))return null;if(!cur||cur==='USD')return n;const r=(settings.rates||{})[cur];return num(r)&&r>0?n/r:null;}
function bestCover(u,key){const ss=activeSch(u);if(!ss.length)return 'unknown';let best='no',r=-1;for(const s of ss){const v=(s.covers||{})[key]||'unknown';if(COVER_RANK[v]>r){r=COVER_RANK[v];best=v;}}return best;}
function isFullRide(s){const c=s.covers||{};return c.tuition==='yes'&&c.housing==='yes'&&c.food==='yes';}
function funding(u){const ss=activeSch(u);if(ss.some(isFullRide))return 'fullride';if(ss.some(s=>s.type==='need'))return 'need';if(ss.length)return 'partial';if(u.noAid)return 'none';return 'unknown';}
function nextDeadline(u){const now=Date.now();let best=null;for(const d of (u.deadlines||[])){if(d.done)continue;const i=deadlineInstant(d);if(i!=null&&i>=now&&(!best||i<best.inst))best={...d,inst:i};}return best;}
function allDeadlines(unis){const out=[];for(const u of unis){if(u.status==='dropped'||u.status==='rejected')continue;for(const d of (u.deadlines||[])){const inst=deadlineInstant(d);if(inst!=null)out.push({...d,uni:u,inst});}}return out.sort((a,b)=>a.inst-b.inst);}
function unverified(u){
  const out=[];const c=u.costs||{};
  if(!isVerified(c.published))out.push('опубликованная стоимость');
  for(const d of u.deadlines||[])if(!d.done&&!isVerified(d))out.push('дедлайн «'+d.label+'»');
  for(const s of u.scholarships||[])if(!isVerified(s))out.push('стипендия «'+s.name+'»');
  return out;
}
function urgentTasks(tasks){
  return tasks.filter(t=>!t.done&&((t.due&&daysUntil(t.due)<=7)||t.priority==='high'))
    .sort((a,b)=>(a.due?daysUntil(a.due):999)-(b.due?daysUntil(b.due):999)||(a.priority==='high'?-1:1));
}
function docProgress(u){const d=u.documents||[];return {n:d.length,ok:d.filter(x=>x.status==='ready'||x.status==='sent').length};}
function countryKey(c){return (c||'').trim().toLowerCase();}
function byCountry(unis){
  const m=new Map();
  for(const u of unis){const k=countryKey(u.country)||'—';if(!m.has(k))m.set(k,{key:k,name:(u.country||'').trim()||'Страна не указана',list:[]});m.get(k).list.push(u);}
  return [...m.values()].sort((a,b)=>a.key==='—'?1:b.key==='—'?-1:a.name.localeCompare(b.name,'ru'));
}
function sortUnis(list,sort,S){
  const key={
    deadline:u=>{const n=nextDeadline(u);return n?n.inst:9e15;},
    cost:u=>{const f=finance(u);const v=toUSD(f.mine,f.cur,S);return v==null?9e15:v;},
    status:u=>STATUSES.findIndex(s=>s.id===u.status),
    tier:u=>({reach:0,target:1,safety:2})[u.tier]??3,
  }[sort];
  const k=new Map(list.map(u=>[u.id,key?key(u):0]));
  return [...list].sort((a,b)=>(k.get(a.id)-k.get(b.id))||a.name.localeCompare(b.name,'ru'));
}
function blobUrl(assetId){return '/_blob/'+assetId;}

function fmtSize(b){if(!num(b))return '';return b<1024*1024?Math.max(1,Math.round(b/1024))+' КБ':(b/1048576).toFixed(1).replace('.',',')+' МБ';}

/* ----- доступ к возможностям артефакта (файлы, Claude) ----- */
const capCache={};
function useCap(name){
  // значения оборачиваются в функции: sample — сама функция, и Preact иначе вызвал бы её как обновитель
  const [v,setV]=useState(()=>capCache[name]);
  useEffect(()=>{
    if(capCache[name]!==undefined){setV(()=>capCache[name]);return;}
    const c=window.claude;
    if(!c||typeof c.use!=='function'){capCache[name]=null;setV(()=>null);return;}
    let alive=true;
    c.use(name).then(x=>{capCache[name]=x||null;if(alive)setV(()=>x||null);},()=>{capCache[name]=null;if(alive)setV(()=>null);});
    return ()=>{alive=false;};
  },[]);
  return v;
}

/* ----- чтение PDF (pdf.js загружается только при первом использовании) ----- */
let pdfjsP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Не удалось загрузить модуль чтения PDF. Проверьте интернет.'));document.head.appendChild(s);});}
function getPdfjs(){
  if(!pdfjsP)pdfjsP=(async()=>{await loadScript(PDFJS+'/pdf.min.js');await loadScript(PDFJS+'/pdf.worker.min.js');const lib=window.pdfjsLib;if(!lib)throw new Error('Модуль чтения PDF не загрузился');lib.GlobalWorkerOptions.workerSrc=PDFJS+'/pdf.worker.min.js';return lib;})().catch(e=>{pdfjsP=null;throw e;});
  return pdfjsP;
}
async function pdfToText(blob,onProgress){
  const lib=await getPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
  const n=Math.min(doc.numPages,60);let out='';
  for(let i=1;i<=n;i++){
    const p=await doc.getPage(i);const tc=await p.getTextContent();
    out+='\n\n[стр. '+i+']\n'+tc.items.map(it=>(it.str||'')+(it.hasEOL?'\n':' ')).join('');
    onProgress&&onProgress(i,n);
  }
  return {text:out,doc,pages:doc.numPages};
}
async function pdfPagesToImages(doc,max){
  const out=[];
  for(let i=1;i<=Math.min(doc.numPages,max);i++){
    const p=await doc.getPage(i);const vp=p.getViewport({scale:1.5});
    const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));
  }
  return out;
}

function normalizeExtract(d){

    costs:{year:s(c.year),items,total:toNum(c.total),note:s(c.note)},
    scholarships:arr(d.scholarships).filter(x=>x&&typeof x==='object'&&s(x.name)).map(x=>{const cov=x.covers&&typeof x.covers==='object'?x.covers:{};return {name:s(x.name),type:SCH_TYPES[x.type]?x.type:'university',amount:toNum(x.amount),covers:Object.fromEntries(COVER_KEYS.map(([k])=>[k,cv(cov[k])])),stipend:s(x.stipend),conditions:s(x.conditions),renewable:['yes','no'].includes(x.renewable)?x.renewable:'unknown'};}),

/* =========================================================
   Хранилище: общее (db артефакта) или локальное
   ========================================================= */
const LS_KEY='admissions-dashboard-v1';
const Store={
  data:{unis:{},tasks:{},settings:{...DEFAULT_SETTINGS}},
  mode:'loading', ready:false, note:'', db:null, subs:new Set(), q:{},
  emit(){this.subs.forEach(f=>f());},
  persistLocal(){if(this.mode==='local')lsSet(LS_KEY,JSON.stringify(this.data));},
  async put(coll,id,doc){
    const body=clone(doc);
    if(coll==='settings'){this.data={...this.data,settings:body};}
    else{this.data={...this.data,[coll]:{...this.data[coll],[id]:body}};}
    this.emit();
    if(this.mode==='db'){
      const ref=coll==='settings'?this.db.doc('meta/settings'):this.db.collection(coll).doc(id);
      return this.enqueue(coll+'/'+id,()=>ref.set(body)).catch(e=>{toast('Не сохранилось: '+(e&&e.message||'ошибка хранилища'));throw e;});
    }
    this.persistLocal();
  },
  async remove(coll,id){
    const m={...this.data[coll]};delete m[id];this.data={...this.data,[coll]:m};this.emit();
    if(this.mode==='db')return this.enqueue(coll+'/'+id,()=>this.db.collection(coll).doc(id).delete()).catch(e=>toast('Не удалось удалить: '+(e&&e.message||'ошибка')));
    this.persistLocal();
  },
  enqueue(key,fn){const p=(this.q[key]||Promise.resolve()).then(fn,fn);this.q[key]=p.catch(()=>{});return p;},
  useLocal(note){
    this.mode='local';this.note=note||'';
    try{const raw=lsGet(LS_KEY);if(raw){const d=JSON.parse(raw);this.data={unis:d.unis||{},tasks:d.tasks||{},settings:{...DEFAULT_SETTINGS,...(d.settings||{})}};}}catch(e){}
    this.ready=true;this.emit();
  },
  async init(){
    const c=window.claude;
    if(!c||typeof c.use!=='function'){this.useLocal('');return;}
    let db=null;try{db=await c.use('db');}catch(e){}
    if(!db){this.useLocal('Общее хранилище недоступно в этом окне — изменения сохраняются только в этом браузере.');return;}
    this.db=db;this.mode='db';this.emit();
    const got={unis:false,tasks:false,settings:false};
    const timer=setTimeout(()=>{this.note='Не удаётся связаться с хранилищем. Проверьте интернет — данные появятся сами, перезагружать не нужно.';this.ready=true;this.emit();},10000);
    const mark=(k,snap)=>{if(!snap.metadata.fromCache)got[k]=true;if(got.unis&&got.tasks&&got.settings){clearTimeout(timer);if(this.note.startsWith('Не удаётся'))this.note='';}if(k==='unis')this.ready=true;this.emit();};
    const onErr=e=>{clearTimeout(timer);this.ready=true;this.note='Хранилище недоступно ('+(e&&e.code||'ошибка')+'). Обновите страницу позже.';this.emit();};
    db.collection('unis').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id};});this.data={...this.data,unis:m};mark('unis',s);},onErr);
    db.collection('tasks').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id};});this.data={...this.data,tasks:m};mark('tasks',s);},onErr);
    db.doc('meta/settings').onSnapshot(s=>{this.data={...this.data,settings:{...DEFAULT_SETTINGS,...(s.exists?s.data():{})}};mark('settings',s);},onErr);
  },
};

function SourceTag({f,label}){
  if(!isVerified(f)){
    const txt='Не проверено'+(f&&f.origin?' · из '+(f.origin==='pdf'?'PDF':'текста')+', сверьте':'');
    const cand=f&&f.source&&safeUrl(f.source);
    return cand?html`<a class="src unv" href=${cand} target="_blank" rel="noopener noreferrer" title="Источник ещё не сверен — откройте и проверьте">${txt} · ${hostOf(cand)} ↗</a>`
      :html`<span class="src unv" title="Нет ссылки на источник или даты проверки">${txt}</span>`;
  }
  const u=safeUrl(f.source);const age=daysSince(f.checkedAt);const stale=age>45;
  const txt=(label?label+' · ':'')+(stale?'проверено '+age+' '+plural(age,'день','дня','дней')+' назад':'проверено '+fmtDate(f.checkedAt,{day:'numeric',month:'short'}));
  const inner=html`${stale?html`<${Icon} n="alert" s=${13}/>`:html`<${Icon} n="check" s=${13}/>`} ${txt} · ${u?hostOf(u):'источник'}`;
  return u?html`<a class=${'src '+(stale?'stale':'ok')} href=${u} target="_blank" rel="noopener noreferrer" title=${f.source}>${inner}</a>`:html`<span class=${'src '+(stale?'stale':'ok')}>${inner}</span>`;
}

}

function FinanceOverview({unis,S}){

  const comparable=rows.filter(r=>r.mineUSD!=null).sort((a,b)=>a.mineUSD-b.mineUSD);
  const rest=rows.filter(r=>r.mineUSD==null);
  const max=Math.max(1,...comparable.map(r=>Math.max(r.baseUSD||0,r.offerCoaUSD||0,r.mineUSD||0)),num(S.budgetUSD)?S.budgetUSD:0);
  const budget=num(S.budgetUSD)?S.budgetUSD:null;

    <div class="list">

        return html`<a class="fin-row" href=${'#uni-'+r.u.id}>
          <div class="fin-name"><b>${r.u.name}</b><span class=${'tag t-'+b.tone}>${b.label}</span>${r.f.basis==='prelim'&&r.f.uncounted.length?html` <span class="small faint">помощь не учтена: сумма неизвестна</span>`:''}</div>
          <div class="fin-track" title=${'Стоимость года ≈ '+fmtMoney(r.baseUSD,'USD')+', остаток ≈ '+fmtMoney(r.mineUSD,'USD')}>
            <div class="cov grow" style=${{width:w+'%'}}></div>
            <div class=${'pay grow '+(r.f.basis==='offer'?'offer':'')} style=${{width:Math.max(pay,.8)+'%'}}></div>
            ${budget?html`<div class="budget" style=${{left:'calc('+(budget/max*100)+'% - 1px)'}}></div>`:''}
          </div>
          <div class="fin-amt"><b>${fmtMoney(r.mineUSD,'USD')}</b><span>${r.f.cur!=='USD'?fmtMoney(r.f.mine,r.f.cur)+' · ':''}${num(kgs)?'≈ '+Math.round(r.mineUSD*kgs).toLocaleString('ru-RU')+' сом · ':''}${over!=null?(over<=0?'в бюджете':'выше бюджета на '+fmtMoney(over,'USD')):r.baseUSD?'из '+fmtMoney(r.baseUSD,'USD'):''}</span></div>
        </a>`;})}
      ${rest.map(r=>{const why=r.f.basis==='none'?'нет данных о стоимости':'нужен курс '+r.f.cur+' в настройках';
        return html`<a class="fin-row" href=${r.f.basis==='none'?'#uni-'+r.u.id:'#config'}>
          <div class="fin-name"><b>${r.u.name}</b><span class="tag t-unv">${BASIS[r.f.basis].label}</span></div>
          <div class="small faint">${r.f.basis==='none'?'Опубликованной стоимости нет. Добавьте её или свою оценку расходов (жильё, питание, перелёты) — тогда появится остаток.':'Остаток: '+fmtMoney(r.f.mine,r.f.cur)+'. Для сравнения в долларах задайте курс.'}</div>
          <div class="fin-amt"><b class="faint">—</b><span>${why}</span></div>
        </a>`;})}
    </div>
    ${rows.length?html`<div class="legend"><span><i style="background:var(--accent)"></i>мой остаток (предварительно)</span><span><i style="background:var(--ok)"></i>остаток по предложению вуза</span><span><i style="background:repeating-linear-gradient(-45deg,var(--ok-soft) 0 3px,color-mix(in srgb,var(--ok) 25%,var(--ok-soft)) 3px 5px)"></i>покрыто стипендией</span>${budget?html`<span><i style="background:var(--ink);width:2px"></i>бюджет семьи</span>`:''}</div>`:html`<div class="empty small">Нет вузов для расчёта</div>`}
  </section>`;
}

function setUnisFilter(p){FILTERS={...F0,sort:FILTERS.sort,group:FILTERS.group,...p};lsSet(FKEY,JSON.stringify(FILTERS));}
function matchStatus(u,f){if(f==='all')return true;const g=PIPE.find(p=>p.id===f);return g?g.st.includes(u.status):u.status===f;}

function CountryGroup({g,S,collapsed,onToggle}){
  const list=g.list;

function FilesSection({u,ui}){
  const assets=useCap('assets');const inp=useRef();const [busy,setBusy]=useState(false);const [over,setOver]=useState(false);
  const files=u.files||[];
  const save=list=>A.patchUni(u.id,{files:list});
  const upload=async list=>{
    if(!assets||!list.length)return;setBusy(true);const added=[];
    for(const file of list){
      const type=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'');
      try{const r=await assets.upload(file,type?{type}:undefined);
        added.push({id:uid('f'),assetId:r.id,name:file.name,size:r.sizeBytes,type:r.contentType,kind:/award|aid|offer|financ/i.test(file.name)?'award':'other',addedAt:todayISO()});}
      catch(e){toast(uploadErr(e,file.name));}
    }
    if(added.length){await save([...(((Store.data.unis[u.id]||u).files)||[]),...added]);toast(added.length===1?'Файл добавлен':'Файлов добавлено: '+added.length);}
    setBusy(false);
  };
  const del=async f=>{try{if(assets)await assets.delete(f.assetId);}catch(e){}await save(files.filter(x=>x.id!==f.id));toast('Файл удалён');};
  return html`<section class="section anchor" id="s-files">
    <div class="sec-head"><h2><${Icon} n="clip"/>Файлы</h2>${assets?html`<button class="btn sm" disabled=${busy} onClick=${()=>inp.current&&inp.current.click()}><${Icon} n="upload" s=${15}/>${busy?'Загружаю…':'Загрузить'}</button>`:''}</div>
    <div class="card"><div class="list">
      ${files.map(f=>html`<div class="file" key=${f.id}>
        <span class="file-ic">${(f.type||'').includes('pdf')?'PDF':'ФОТО'}</span>
        <div class="file-main"><a href=${blobUrl(f.assetId)} target="_blank" rel="noopener">${f.name}</a><span class="small faint">${FILE_KINDS[f.kind]||'Другое'} · ${fmtSize(f.size)} · ${fmtDate(f.addedAt)}</span></div>
        <div class="file-acts">
          <select class="inp" aria-label="Тип файла" value=${f.kind||'other'} onChange=${e=>save(files.map(x=>x.id===f.id?{...x,kind:e.target.value}:x))}>${Object.entries(FILE_KINDS).map(([k,v])=>html`<option value=${k}>${v}</option>`)}</select>
          <button class="btn sm" onClick=${()=>ui.open({type:'import',uni:u,fileRef:f})}><${Icon} n="spark" s=${14}/>Распознать</button>
          <${ConfirmBtn} small label="Удалить" armedLabel="Удалить файл?" onConfirm=${()=>del(f)}/>
        </div>
      </div>`)}
      ${assets?html`<label class=${'drop'+(over?' over':'')} style="margin:14px 18px" onDragOver=${e=>{e.preventDefault();setOver(true);}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);upload([...e.dataTransfer.files]);}}>
          <${Icon} n="upload" s=${22}/><span><b>Перетащите PDF или фото</b> или нажмите, чтобы выбрать</span><span class="small faint">Брошюры, требования, письма вуза, award letter — до 20 МБ</span>
          <input ref=${inp} type="file" multiple accept="application/pdf,image/png,image/jpeg,image/webp" class="sr" onChange=${e=>{const l=[...e.target.files];e.target.value='';upload(l);}}/>
        </label>`
      :html`<div class="empty small">${assets===undefined?'Проверяю доступ к хранилищу файлов…':'Загрузка файлов работает в версии дашборда на claude.ai — у владельца и редакторов.'}</div>`}

function ImportSheet({uni,fileRef,ui}){
  const sample=useCap('sample');const assets=useCap('assets');
  const [tab,setTab]=useState(fileRef?'file':'pdf');
  const [file,setFile]=useState(null);const [text,setText]=useState('');const [over,setOver]=useState(false);
  const [step,setStep]=useState('input');const [msg,setMsg]=useState('');const [err,setErr]=useState('');
  const [result,setResult]=useState(null);
  const ctl=useRef(null);
  const run=async()=>{
    setErr('');setStep('working');setMsg('Готовлю документ…');const c=new AbortController();ctl.current=c;
    try{
      let content='',images=null,name='',att=null,origin='pdf';
      if(tab==='text'){content=text.trim();name='текст, введённый вручную';origin='text';}
      else{
        let blob=file;name=file?file.name:'';
        if(tab==='file'){setMsg('Открываю сохранённый файл…');const r=await fetch(blobUrl(fileRef.assetId));if(!r.ok)throw new Error('Не удалось открыть сохранённый файл. Загрузите его заново.');blob=await r.blob();name=fileRef.name;}
        const isImg=(blob.type||'').startsWith('image/')||/\.(png|jpe?g|webp)$/i.test(name);
        if(isImg){const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)throw {code:'images_unavailable'};images=[blob];}
        else{
          const r=await pdfToText(blob,(i,n)=>setMsg('Читаю PDF: страница '+i+' из '+n));
          content=r.text;if(r.pages>60)content+='\n\n[Документ длиннее 60 страниц — прочитаны первые 60]';
          if(content.replace(/\[стр\. \d+\]|\s/g,'').length<200){
            const lim=await sample.limits().catch(()=>null);
            if(!lim||!lim.images)throw new Error('В этом PDF нет текста (похоже на скан), а отправка изображений здесь недоступна. Скопируйте текст во вкладку «Текст».');
            setMsg('В PDF нет текста — похоже на скан. Готовлю изображения страниц…');
            images=await pdfPagesToImages(r.doc,Math.min(lim.images.maxCount||4,5));content='';
          }
        }
        if(c.signal.aborted){setStep('input');return;}
        if(tab==='pdf'&&assets){setMsg('Сохраняю файл…');try{const up=await assets.upload(blob,blob.type?undefined:{type:'application/pdf'});att={assetId:up.id,size:up.sizeBytes,type:up.contentType,name,isNew:true};}catch(e){toast(uploadErr(e,name));}}
        if(tab==='file')att={assetId:fileRef.assetId,name,isNew:false};
      }
      setMsg('Claude разбирает документ. Обычно это 20–60 секунд…');
      const opts={signal:c.signal,modelTier:'default'};if(images)opts.images=images;
      const data=await sample.json(buildPrompt(content.slice(0,150000),name,uni,!!images),opts);
      setResult({res:normalizeExtract(data),att,origin});setStep('review');
    }catch(e){if(e&&e.code==='cancelled'){setStep('input');return;}setErr(sampleErr(e));setStep('input');}
  };
  if(step==='review'&&result)return html`<${ImportReview} res=${result.res} att=${result.att} origin=${result.origin} uni=${uni} ui=${ui} onBack=${()=>setStep('input')}/>`;
  const canRun=!!sample&&(tab==='text'?text.trim().length>=20:tab==='pdf'?!!file:true);
  const close=()=>{if(ctl.current)ctl.current.abort();ui.close();};
  return html`<${Sheet} title=${uni?'Дополнить «'+uni.name+'» из документа':'Новый вуз из документа'} onClose=${close}
    footer=${step==='working'?html`<span></span><button class="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Остановить</button>`
      :html`<span class="small faint">Ничего не сохранится до вашей проверки</span><div class="row"><button class="btn" onClick=${close}>Отмена</button><button class="btn primary" disabled=${!canRun} onClick=${run}><${Icon} n="spark" s=${16}/>Распознать</button></div>`}>
    ${step==='working'?html`<div class="working"><div class="spin"></div><b>${msg}</b><span class="small muted">Можно остановить в любой момент.</span></div>`:html`
      ${sample===null?html`<div class="notice"><${Icon} n="alert"/><div class="notice-body"><b>Распознавание здесь недоступно</b><span>Оно работает в версии дашборда на claude.ai. В локальной копии добавьте вуз вручную.</span></div></div>`:''}
      ${err?html`<div class="notice" style="background:var(--crit-soft);color:var(--crit)"><${Icon} n="alert"/><span>${err}</span></div>`:''}
      ${fileRef?html`<p>Файл: <b>${fileRef.name}</b></p>`:html`<div class="tabs" role="tablist"><button role="tab" aria-selected=${tab==='pdf'} class=${tab==='pdf'?'on':''} onClick=${()=>setTab('pdf')}>PDF или фото</button><button role="tab" aria-selected=${tab==='text'} class=${tab==='text'?'on':''} onClick=${()=>setTab('text')}>Текст</button></div>`}
      ${tab==='pdf'?html`<label class=${'drop'+(over?' over':'')} onDragOver=${e=>{e.preventDefault();setOver(true);}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files[0];if(f)setFile(f);}}>
          <${Icon} n="upload" s=${26}/>
          <span>${file?html`<b>${file.name}</b> · ${fmtSize(file.size)}`:html`<b>Перетащите PDF или фото страницы</b> или нажмите, чтобы выбрать`}</span>
          <span class="small faint">Брошюра, страница требований или стоимости, письмо о стипендии, award letter</span>
          <input id="imp-file" type="file" class="sr" accept="application/pdf,image/png,image/jpeg,image/webp" onChange=${e=>{const f=e.target.files[0];if(f)setFile(f);}}/>
        </label>`:''}
      ${tab==='text'?html`<${Field} label="Вставьте или напишите текст"><textarea id="imp-text" class="inp" style="min-height:220px" value=${text} onInput=${e=>setText(e.target.value)} placeholder="Скопируйте текст со страницы вуза или напишите своими словами: название, страна, сроки, стоимость, стипендии, требования…"></textarea></${Field}>`:''}
      <p class="small muted">Claude возьмёт из документа только то, что там написано: название, город, программу, дедлайны, стоимость, стипендии, документы и требования. Перед сохранением вы всё увидите и снимете лишнее. Данные из документа помечаются «Не проверено», пока вы их не сверите.</p>`}
  </${Sheet}>`;
}

function Tasks({data,ui}){
  const [showDone,setShowDone]=useState(false);
  const tasks=Object.values(data.tasks);
  const open=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const groups=[
    ['Просрочено',open.filter(t=>t.due&&daysUntil(t.due)<0)],
    ['Сегодня и завтра',open.filter(t=>t.due&&daysUntil(t.due)>=0&&daysUntil(t.due)<=1)],
    ['Эта неделя',open.filter(t=>t.due&&daysUntil(t.due)>1&&daysUntil(t.due)<=7)],
    ['Позже',open.filter(t=>t.due&&daysUntil(t.due)>7)],
    ['Без срока',open.filter(t=>!t.due)],
  ].map(([l,list])=>[l,list.sort((a,b)=>(a.due?daysUntil(a.due):0)-(b.due?daysUntil(b.due):0)||(a.priority==='high'?-1:1))]).filter(g=>g[1].length);
  return html`<div class="wrap">
    <header class="page-head"><div><div class="eyebrow">${open.length} ${plural(open.length,'открытая','открытые','открытых')} · ${done.length} выполнено</div><h1>Задачи</h1></div>
      <button class="btn primary" onClick=${()=>ui.open({type:'task'})}><${Icon} n="plus" s=${16}/>Задача со сроком</button></header>
    <div class="card"><${QuickAdd} placeholder="Быстро добавить задачу без срока" onAdd=${title=>A.saveTask({id:uid('t'),title,uniId:null,due:null,priority:'normal',done:false,createdAt:todayISO()})}/></div>
    ${groups.map(([l,list])=>html`<section class="section"><div class="sec-head"><h2>${l} <span class="faint small">${list.length}</span></h2></div>
      <div class="card"><div class="list">${list.map(t=>html`<${TaskRow} key=${t.id} t=${t} data=${data} ui=${ui}/>`)}</div></div></section>`)}
    ${!open.length?html`<div class="card empty">Открытых задач нет.</div>`:''}
    ${done.length?html`<section class="section"><button class="btn ghost" style="justify-self:start" onClick=${()=>setShowDone(!showDone)}>${showDone?'Скрыть':'Показать'} выполненные (${done.length})</button>
      ${showDone?html`<div class="card"><div class="list">${done.map(t=>html`<${TaskRow} key=${t.id} t=${t} data=${data} ui=${ui}/>`)}</div></div>`:''}</section>`:''}
  </div>`;
}

async function exportData(data){
  const payload={app:'admissions-dashboard',version:1,exportedAt:new Date().toISOString(),unis:Object.values(data.unis),tasks:Object.values(data.tasks),settings:data.settings};
  const text=JSON.stringify(payload,null,2);const name='postuplenie-backup-'+todayISO()+'.json';
  const c=window.claude;
  if(c&&typeof c.use==='function'){
    let dl=null;try{dl=await c.use('downloads');}catch(e){}
    if(dl){try{await dl.save({filename:name,data:text});toast('Резервная копия сохранена');}catch(e){if(!e||e.code!=='declined')toast('Не удалось сохранить файл'+(e&&e.message?': '+e.message:''));}return;}
    try{await navigator.clipboard.writeText(text);toast('Скачивание недоступно здесь — копия скопирована в буфер обмена');}catch(e){toast('Скачивание недоступно в этом окне');}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Резервная копия сохранена');
}

const Field=({label,hint,children,wide})=>html`<label class=${'field'+(wide?' wide':'')}><span class="f-label">${label}</span>${children}${hint?html`<span class="f-hint">${hint}</span>`:''}</label>`;
function useForm(init){

function Sheet({title,onClose,children,footer}){

  return html`<div class="overlay" onMouseDown=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class="sheet" role="dialog" aria-modal="true" aria-label=${title} ref=${ref}>
      <div class="sheet-head"><h2>${title}</h2><button class="btn icon ghost" onClick=${onClose} aria-label="Закрыть"><${Icon} n="x"/></button></div>
      <div class="sheet-body">${children}</div>

function CostForm({uni,layer,ui}){
  const c=uni.costs||{};const cur=c.currency||'USD';
  const strItems=it=>Object.fromEntries(COST_ITEMS.map(([k])=>[k,num((it||{})[k])?String(it[k]):'']));
  const init=layer==='offer'?{...(c.offer||{}),coa:num((c.offer||{}).coa)?String(c.offer.coa):'',grants:num((c.offer||{}).grants)?String(c.offer.grants):'',loans:num((c.offer||{}).loans)?String(c.offer.loans):'',work:num((c.offer||{}).work)?String(c.offer.work):'',net:num((c.offer||{}).net)?String(c.offer.net):''}
    :{...(c[layer]||{}),items:strItems((c[layer]||{}).items),total:num((c[layer]||{}).total)?String(c[layer].total):''};
  const [f,set]=useForm(init);
  const titles={published:'Опубликованная стоимость',estimate:'Моя оценка стоимости года',offer:'Предложение вуза (award letter)'};
  const save=()=>{let body;
    if(layer==='offer'){body={coa:toNum(f.coa),grants:toNum(f.grants),loans:toNum(f.loans),work:toNum(f.work),net:toNum(f.net),receivedAt:f.receivedAt||'',ref:(f.ref||'').trim(),note:(f.note||'').trim()};}
    else{const items={};for(const [k] of COST_ITEMS)items[k]=toNum(f.items[k]);body={items,total:toNum(f.total),note:(f.note||'').trim()};
      if(layer==='published'){body.year=(f.year||'').trim();body.source=f.source||'';body.checkedAt=f.checkedAt||'';}}
    A.patchUni(uni.id,{costs:{...c,currency:cur,[layer]:body}});ui.close();toast('Сохранено');};
  const clear=()=>{const n={...c};delete n[layer];A.patchUni(uni.id,{costs:n});ui.close();toast('Очищено');};
  const copyPub=()=>{set('items',strItems((c.published||{}).items));};
  return html`<${Sheet} title=${titles[layer]} onClose=${ui.close} footer=${html`<${Footer} onClose=${ui.close} onSave=${save} onDelete=${c[layer]?clear:null}/>`}>
    ${layer==='published'?html`<p class="small muted">Только цифры с официальной страницы Cost of Attendance. Если строки нет на странице — оставьте пустой, она будет «Не проверено». Валюта: ${cur}.</p>
      <div class="f-row"><${Field} label="Учебный год цен"><input id="c-year" class="inp" value=${f.year||''} onInput=${e=>set('year',e.target.value)} placeholder="2026–27"/></${Field}>
        <${Field} label="Итого по данным вуза" hint="Если вуз публикует общую сумму"><input id="c-total" class="inp" inputmode="decimal" value=${f.total} onInput=${e=>set('total',e.target.value)}/></${Field}></div>`:''}
    ${layer==='estimate'?html`<p class="small muted">Ваша оценка, например на 2027–28 с учётом роста цен или реальной аренды в городе. Не требует источника, но показывается как «предварительный расчёт».</p>
      ${c.published&&c.published.items?html`<button class="btn sm" style="justify-self:start" onClick=${copyPub}>Скопировать строки из опубликованной стоимости</button>`:''}`:''}
    ${layer!=='offer'?html`<div class="f-row keep">${COST_ITEMS.map(([k,l])=>html`<${Field} label=${l+', '+cur}><input id=${'ci-'+k} class="inp" inputmode="decimal" value=${f.items[k]} onInput=${e=>set('items.'+k,e.target.value)}/></${Field}>`)}</div>
      <${Field} label="Примечание"><textarea class="inp" value=${f.note||''} onInput=${e=>set('note',e.target.value)} placeholder="Например: питание облагается НДС; цены за 2026–27"></textarea></${Field}>`:''}
    ${layer==='published'?html`<${SourceFields} f=${f} set=${set}/>`:''}
    ${layer==='offer'?html`<p class="small muted">Цифры из официального письма о финансовой помощи (сумма за год, ${cur}). Они заменят предварительный расчёт в «моём остатке».</p>
      <div class="f-row"><${Field} label="Стоимость года в письме (COA)"><input id="o-coa" class="inp" inputmode="decimal" value=${f.coa} onInput=${e=>set('coa',e.target.value)}/></${Field}>
        <${Field} label="Гранты и стипендии (не надо возвращать)"><input id="o-grants" class="inp" inputmode="decimal" value=${f.grants} onInput=${e=>set('grants',e.target.value)}/></${Field}>
        <${Field} label="Займы"><input id="o-loans" class="inp" inputmode="decimal" value=${f.loans} onInput=${e=>set('loans',e.target.value)}/></${Field}>
        <${Field} label="Work-study"><input id="o-work" class="inp" inputmode="decimal" value=${f.work} onInput=${e=>set('work',e.target.value)}/></${Field}></div>
      <${Field} label="К оплате семьёй (если указано в письме)" hint="Если пусто — считаю как COA − гранты"><input id="o-net" class="inp" inputmode="decimal" value=${f.net} onInput=${e=>set('net',e.target.value)}/></${Field}>
      <div class="f-row"><${Field} label="Дата письма"><input id="o-date" class="inp" type="date" value=${f.receivedAt||''} onInput=${e=>set('receivedAt',e.target.value)}/></${Field}>
        <${Field} label="Где лежит письмо"><input id="o-ref" class="inp" value=${f.ref||''} onInput=${e=>set('ref',e.target.value)} placeholder="Портал заявки, письмо от 15 марта"/></${Field}></div>
      <${Field} label="Условия предложения"><textarea class="inp" value=${f.note||''} onInput=${e=>set('note',e.target.value)} placeholder="Например: нужно сохранять GPA 3.0, грант на 4 года"></textarea></${Field}>`:''}
  </${Sheet}>`;
}

function ScholarshipForm({uni,item,ui}){
  const isNew=!item;const cur=(uni.costs||{}).currency||'USD';
  const [f,set]=useForm(item?{...item,amount:num(item.amount)?String(item.amount):''}:{name:'',type:'university',status:'planned',amount:'',covers:{tuition:'unknown',housing:'unknown',food:'unknown',insurance:'unknown',travel:'unknown'},stipend:'',conditions:'',renewable:'unknown',include:true,source:'',checkedAt:''});
  const save=()=>{const s={...f,id:f.id||uid('s'),name:f.name.trim(),amount:toNum(f.amount)};const list=isNew?[...(uni.scholarships||[]),s]:(uni.scholarships||[]).map(x=>x.id===s.id?s:x);A.patchUni(uni.id,{scholarships:list});ui.close();toast('Стипендия сохранена');};
  const del=()=>{A.patchUni(uni.id,{scholarships:(uni.scholarships||[]).filter(x=>x.id!==item.id)});ui.close();toast('Стипендия удалена');};

    <${Field} label="Название стипендии *"><input id="s-name" class="inp" value=${f.name} onInput=${e=>set('name',e.target.value)} placeholder="Например, KAIST International Student Scholarship"/></${Field}>
    <div class="f-row"><${Field} label="Тип"><select id="s-type" class="inp" value=${f.type} onChange=${e=>set('type',e.target.value)}>${Object.entries(SCH_TYPES).map(([k,v])=>html`<option value=${k}>${v}</option>`)}</select></${Field}>
      <${Field} label="Мой статус"><select id="s-status" class="inp" value=${f.status} onChange=${e=>set('status',e.target.value)}>${Object.entries(SCH_STATUS).map(([k,v])=>html`<option value=${k}>${v}</option>`)}</select></${Field}></div>
    <fieldset class="fs"><legend>Что покрывает ${fr?'· full ride':''}</legend><div class="cover-grid">
      ${COVER_KEYS.map(([k,l])=>html`<div class="crow"><span>${l}</span><${Seg} label=${l} value=${(f.covers||{})[k]||'unknown'} opts=${COVER_OPTS} onChange=${v=>set('covers.'+k,v)}/></div>`)}
    </div></fieldset>
    <div class="f-row"><${Field} label=${'Возможная сумма покрытия в год, '+cur} hint="Включите и стипендию на жизнь за год. Если пусто — считаю по статьям, отмеченным «Да»"><input id="s-amount" class="inp" inputmode="decimal" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/></${Field}>
      <${Field} label="Стипендия на жизнь"><input id="s-stipend" class="inp" value=${f.stipend} onInput=${e=>set('stipend',e.target.value)} placeholder="Например: 900 000 KRW в месяц"/></${Field}></div>
    <div class="f-row"><${Field} label="Продлевается на весь срок?"><select id="s-renew" class="inp" value=${f.renewable} onChange=${e=>set('renewable',e.target.value)}><option value="unknown">Не проверено</option><option value="yes">Да</option><option value="no">Нет</option></select></${Field}>
      <div class="field"><span class="f-label">Расчёт</span><label class="toggle" style="min-height:42px"><input type="checkbox" checked=${f.include!==false} onChange=${e=>set('include',e.target.checked)}/>Учитывать в моём остатке</label></div></div>
    <${Field} label="Условия и требования"><textarea id="s-cond" class="inp" value=${f.conditions} onInput=${e=>set('conditions',e.target.value)} placeholder="GPA, тесты, отдельная заявка, нужно ли сохранять баллы"></textarea></${Field}>
    <${SourceFields} f=${f} set=${set}/>
  </${Sheet}>`;

function TaskForm({task,ui}){
  const isNew=!task||!task.id;
  const [f,set]=useForm({title:'',uniId:null,due:'',priority:'normal',note:'',done:false,...(task||{})});
  const unis=Object.values(Store.data.unis).sort((a,b)=>a.name.localeCompare(b.name));
  const save=()=>{A.saveTask({...f,id:f.id||uid('t'),title:f.title.trim(),uniId:f.uniId||null,due:f.due||null,createdAt:f.createdAt||todayISO()});ui.close();toast(isNew?'Задача добавлена':'Сохранено');};
  const del=()=>{A.deleteTask(task.id);ui.close();toast('Задача удалена');};
  return html`<${Sheet} title=${isNew?'Новая задача':'Задача'} onClose=${ui.close} footer=${html`<${Footer} onClose=${ui.close} onSave=${save} canSave=${f.title.trim()} onDelete=${isNew?null:del}/>`}>
    <${Field} label="Что сделать *"><input id="t-title" class="inp" value=${f.title} onInput=${e=>set('title',e.target.value)} placeholder="Например: заполнить CSS Profile"/></${Field}>
    <div class="f-row"><${Field} label="Вуз"><select id="t-uni" class="inp" value=${f.uniId||''} onChange=${e=>set('uniId',e.target.value||null)}><option value="">— общая задача —</option>${unis.map(u=>html`<option value=${u.id}>${u.name}</option>`)}</select></${Field}>
      <${Field} label="Срок"><input id="t-due" class="inp" type="date" value=${f.due||''} onInput=${e=>set('due',e.target.value)}/></${Field}></div>
    <div class="row"><span class="f-label">Приоритет</span><${Seg} label="Приоритет" value=${f.priority} opts=${[['normal','Обычный'],['high','Важно']]} onChange=${v=>set('priority',v)}/></div>
    <${Field} label="Заметка"><textarea id="t-note" class="inp" value=${f.note||''} onInput=${e=>set('note',e.target.value)}></textarea></${Field}>
    ${!isNew?html`<label class="toggle"><input type="checkbox" checked=${!!f.done} onChange=${e=>set('done',e.target.checked)}/>Выполнено</label>`:''}
  </${Sheet}>`;
}
function AddChooser({ui}){
  return html`<${Sheet} title="Добавить" onClose=${ui.close}>
    <div class="choose">
      <button onClick=${()=>ui.open({type:'uni'})}><${Icon} n="uni" s=${22}/><span><b>Вуз или программу</b><span class="small muted">Название, страна, статус, ссылки</span></span></button>
      <button onClick=${()=>ui.open({type:'import'})}><${Icon} n="spark" s=${22}/><span><b>Вуз из PDF или текста</b><span class="small muted">Claude прочитает документ, вы проверите</span></span></button>
      <button onClick=${()=>ui.open({type:'task'})}><${Icon} n="tasks" s=${22}/><span><b>Задачу</b><span class="small muted">С датой и привязкой к вузу</span></span></button>
      <p class="small faint">Дедлайны, стипендии, стоимость и документы добавляются на странице конкретного вуза.</p>
    </div></${Sheet}>`;
}
function ModalHost({m,ui}){
  const fresh=x=>x&&Store.data.unis[x.id]||x;
  switch(m.type){
    case 'uni':return html`<${UniForm} uni=${m.uni&&fresh(m.uni)} ui=${ui}/>`;
    case 'deadline':return html`<${DeadlineForm} uni=${fresh(m.uni)} item=${m.item} ui=${ui}/>`;
    case 'cost':return html`<${CostForm} uni=${fresh(m.uni)} layer=${m.layer} ui=${ui}/>`;
    case 'scholarship':return html`<${ScholarshipForm} uni=${fresh(m.uni)} item=${m.item} ui=${ui}/>`;
    case 'task':return html`<${TaskForm} task=${m.task} ui=${ui}/>`;
    case 'add':return html`<${AddChooser} ui=${ui}/>`;
    case 'import':return html`<${ImportSheet} uni=${m.uni&&fresh(m.uni)} fileRef=${m.fileRef} ui=${ui}/>`;
    case 'req':return html`<${ReqForm} uni=${fresh(m.uni)} ui=${ui}/>`;
  }
  return null;
}

/* =========================================================
   Приложение
   ========================================================= */
function App(){
  const [,force]=useState(0);
  useEffect(()=>{const f=()=>force(x=>x+1);Store.subs.add(f);f();return ()=>Store.subs.delete(f);},[]);
  const route=useRoute();
  const [modal,setModal]=useState(null);
  const [t,setT]=useState(null);
  useEffect(()=>{window.__toast=m=>setT({m,k:Date.now()});},[]);
  useEffect(()=>{if(!t)return;const x=setTimeout(()=>setT(null),2600);return ()=>clearTimeout(x);},[t]);
  const ui={open:m=>setModal(m),close:()=>setModal(null)};
  const data=Store.data;
  let page;
  if(!Store.ready)page=html`<div class="wrap"><div class="skel"></div><div class="grid2"><div class="skel"></div><div class="skel"></div></div><p class="faint small">Загружаю ваши вузы и задачи…</p></div>`;
  else if(route.startsWith('uni-'))page=html`<${UniDetail} id=${route.slice(4)} data=${data} ui=${ui}/>`;
  else if(route==='unis')page=html`<${Unis} data=${data} ui=${ui}/>`;
  else if(route==='tasks')page=html`<${Tasks} data=${data} ui=${ui}/>`;
  else if(route==='config')page=html`<${Config} key=${JSON.stringify(data.settings)} data=${data}/>`;
  else page=html`<${Home} data=${data} ui=${ui}/>`;
  return html`<div class="shell">
    <${Sidebar} route=${route} data=${data} ui=${ui}/>
    <main class="main">
      ${Store.note?html`<div class="wrap" style="margin-bottom:16px"><div class="notice"><${Icon} n="alert"/><span>${Store.note}</span></div></div>`:''}
      <div class="view" key=${route}>${page}</div>
    </main>
    <${BottomNav} route=${route} data=${data} ui=${ui}/>
    ${modal?html`<${ModalHost} m=${modal} ui=${ui}/>`:''}
    ${t?html`<div class="toast" role="status" key=${t.k}>${t.m}</div>`:''}
  </div>`;
}
render(html`<${App}/>`,document.getElementById('app'));
Store.init();
})();
</script>
